# Socket Security GitHub Actions workflow
# Runs a Socket supply-chain security scan on every push to any branch and
# on every pull request.
#
# Requires a repository secret: SOCKET_SECURITY_API_KEY
# (create a token at https://socket.dev/settings/api-tokens)

name: Socket

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: socket-scan-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  socket-security:
    name: Socket supply-chain scan
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          # For PRs, fetch one additional commit for proper diff analysis
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Socket CLI
        run: pip install socketsecurity --upgrade

      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the PR number based on the event type
          PR_NUMBER=0
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
          fi

          # The CLI detects repository, branch, commit SHA, commit message,
          # committer and changed files automatically from the git context
          socketcli \
            --target-path $GITHUB_WORKSPACE \
            --scm github \
            --pr-number $PR_NUMBER
