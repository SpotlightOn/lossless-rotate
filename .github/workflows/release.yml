name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE: 24 # The Node.js version to build and publish from

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 12 requires pnpm/setup; it installs pnpm (from `packageManager`), Node.js and the
      # dependencies in one step.
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE }}
          cache: true
          require-lockfile: true

      - name: Verify the tag matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json says $PACKAGE_VERSION but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Lint, type check and test
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify the published package
        run: pnpm run verify:package

      # The package is scoped to the npm account (@chimok), so npmjs is the registry; GitHub Packages
      # would require the scope to match the repository owner instead.
      - name: Publish to npm
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$NPMRC"
          npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; print; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            echo "No CHANGELOG section for v$VERSION - using generated notes." >&2
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
