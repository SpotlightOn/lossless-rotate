name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE: 24 # The Node.js version to build and publish from

permissions:
  contents: write # create the GitHub release
  packages: write # publish to GitHub Packages

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      # Optional. When the secret is missing, the public npm registry step is skipped and the
      # package is only published to GitHub Packages.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
          # Writes the GitHub Packages registry and an NODE_AUTH_TOKEN into the npm config,
          # which is what `npm publish` (via publishConfig) picks up.
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json says $PACKAGE_VERSION but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Lint, type check and test
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      # The public npm registry is optional: it needs an NPM_TOKEN secret, and the @scope must be
      # owned on npmjs. GitHub Packages above is the primary target.
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$NPMRC"
          npm publish --registry=https://registry.npmjs.org --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; print; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            echo "No CHANGELOG section for v$VERSION - using generated notes." >&2
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
