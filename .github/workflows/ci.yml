name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 12 is a self-contained binary that installs runtimes itself, so it needs pnpm/setup,
      # not pnpm/action-setup (which went through npm and cannot install pnpm 12). The action reads
      # the pnpm version from package.json's `packageManager`, installs Node.js, caches the store
      # and runs the frozen install; a stale lockfile fails here instead of later.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Packs the tarball and imports it from a throwaway node_modules: a broken exports/files/bin
      # setup only shows up for consumers, never for the source tests.
      - name: Verify the published package
        run: pnpm run verify:package

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # See the lint job: pnpm 12 requires pnpm/setup, which installs this matrix's Node.js too.
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true

      # jpegtran/djpeg turn the differential tests on. They are optional; the suite skips them
      # wherever they are missing, so runners without them only exercise the pure-JS path.
      - name: Install libjpeg-turbo tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo-progs

      - name: Install libjpeg-turbo tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo

      - name: Test
        run: pnpm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          # Node 26 has `--test-coverage-include-all`, so a source file no test loads shows up as
          # 0 % instead of silently missing. The script itself also runs on 24 (`pnpm run coverage`).
          runtime: node@26
          cache: true
          require-lockfile: true

      # Only the JPEG tools, same as the test matrix. No libavif-bin/imagemagick: Ubuntu's avifdec
      # does not apply irot/imir on decode, which the AVIF differential tests require, and the two
      # suites that need those tools do not change any coverage number.
      - name: Install codec tools
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo-progs

      # Fails below the thresholds in the script, and refreshes .github/badges/coverage.svg on the
      # way. The badge is a committed file (no badge service), so it is only written, not pushed.
      - name: Coverage
        run: node scripts/coverage.mjs --summary "$GITHUB_STEP_SUMMARY"

      # The badge only stays honest if someone regenerates it. A warning rather than a failure:
      # adding tests must not turn the pipeline red.
      - name: Check the badge is up to date
        run: |
          if ! git diff --quiet -- .github/badges/coverage.svg; then
            echo "::warning::.github/badges/coverage.svg is stale - run 'pnpm run coverage' and commit the result"
          fi

      - name: Upload the lcov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
